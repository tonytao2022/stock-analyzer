<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>个股深度分析</title>
<style>
:root{--bg:#0f172a;--bg-card:#1e293b;--bg-input:#1a2235;--text:#e2e8f0;--text-muted:#64748b;--text-bright:#f1f5f9;--border:#1e2d4a;--color-primary:#3b82f6;--color-safety:#22c55e;--color-warning:#f59e0b;--color-error:#ef4444;--radius:8px;--transition:.2s}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:24px}
.app-layout{max-width:1100px;margin:auto}
.top-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.search-box{display:flex;gap:8px;flex:1;min-width:300px}
.search-box input{flex:1;padding:10px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;outline:none}
.search-box input:focus{border-color:var(--color-primary)}
.search-box button{padding:10px 20px;background:var(--color-primary);border:none;border-radius:var(--radius);color:#fff;font-size:14px;cursor:pointer;font-weight:600}
.search-box button:hover{opacity:.9}
h1{font-size:18px;color:var(--text-bright)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;color:var(--text-bright);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:768px){.grid-4{grid-template-columns:repeat(2,1fr)}}
.metric-card{text-align:center;padding:16px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border)}
.metric-label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.metric-value{font-size:24px;font-weight:700;color:var(--text-bright)}
.chart-container{width:100%;height:360px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{padding:8px 10px;font-size:12px;color:var(--text-muted);text-align:left;border-bottom:2px solid var(--border)}
td{padding:8px 10px;font-size:13px;border-bottom:1px solid var(--border)}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);font-size:14px}
.error{color:var(--color-error);padding:20px;text-align:center}
.stock-name{font-size:22px;font-weight:700;color:var(--text-bright);margin-bottom:4px}
.stock-code{font-size:13px;color:var(--text-muted)}
</style></head><body>
<div class="app-layout">
<div class="top-bar">
<h1>📊 个股深度分析</h1>
<div class="search-box">
<input id="searchInput" placeholder="输入股票代码，如 000001.SZ 或 600519.SH" onkeydown="if(event.key==='Enter')loadStock()">
<button onclick="loadStock()">分析</button>
</div>
</div>
<div id="mainContent" style="display:none">
<div class="card">
<div class="stock-name" id="stockName"></div>
<div class="stock-code" id="stockCode"></div>
</div>
<div class="grid-4" id="metricsGrid"></div>
<div class="card"><div class="card-title">📈 营收/净利润趋势（近5年）</div><div class="chart-container" id="trendChart"></div></div>
<div class="card"><div class="card-title">📊 ROE趋势</div><div class="chart-container" id="roeChart" style="width:100%;height:260px"></div></div>
<div class="card"><div class="card-title">🏗️ 资本结构（总资产/总负债）</div><div class="chart-container" id="structureChart"></div></div>
<div class="card"><div class="card-title">💰 分红记录</div><div id="dividendTable"></div></div>
</div>
<div class="loading" id="loading">输入股票代码开始分析</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
const API_BASE='/api/v1/management';
// 不依赖api_key，依赖nginx自动注入X-API-Key
function apiGet(url){return fetch(url,{credentials:'same-origin'}).then(r=>r.json())}
function loadStock(){const code=document.getElementById('searchInput').value.trim();if(!code)return;document.getElementById('loading').innerHTML='⏳ 加载中...';document.getElementById('mainContent').style.display='none';
// 确保api_key就绪
fetch(API_BASE+'/system/config').then(r=>r.json()).then(d=>{if(d.code===0&&d.data&&d.data.configs){const c=d.data.configs.find(x=>x.config_key==='api_key');if(c){localStorage.setItem('api_key',c.config_value);}}}).catch(()=>{});Promise.all([apiGet(API_BASE+'/stock/finance?ts_code='+code),apiGet(API_BASE+'/stock/factors?ts_code='+code)]).then(([fin,fac]) => {
if(fin.code!==0||!fin.data){document.getElementById('loading').innerHTML='<div class="error">加载失败: '+(fin.error||'未知错误')+'</div>';return}
renderFinance(fin.data);document.getElementById('loading').style.display='none';document.getElementById('mainContent').style.display='block';}).catch(e=>{document.getElementById('loading').innerHTML='<div class="error">请求失败: '+e.message+'</div>';});}
function renderFinance(data){
const fin=data.annual_trend||data.financials||[];
const km=data.latest_indicators||data.key_metrics||{};
var name=data.name;if(!name||name==='--'){try{name=data.ts_code||'--';if(name.length>6){name=name.substring(0,6);}}catch(e){name='--'}}
document.getElementById('stockName').textContent=(data.stock_name||name||'--')+' ('+(data.ts_code||'')+')';
document.getElementById('stockCode').textContent='';
const metItems=[
  {label:'ROE',val:km.roe!==undefined?km.roe.toFixed(1)+'%':'--',color:km.roe>20?'var(--color-safety)':km.roe>10?'var(--color-primary)':'var(--text-bright)'},
  {label:'毛利率',val:km.gross_profit_margin!==undefined?km.gross_profit_margin.toFixed(1)+'%':(km.gross_margin!==undefined?km.gross_margin.toFixed(1)+'%':'--'),color:km.gross_profit_margin>30?'var(--color-safety)':'var(--color-primary)'},
  {label:'资产负债率',val:km.debt_to_assets!==undefined?km.debt_to_assets.toFixed(1)+'%':'--',color:km.debt_to_assets>70?'var(--color-error)':km.debt_to_assets>50?'var(--color-warning)':'var(--color-safety)'},
  {label:'每股收益',val:km.eps!==undefined?km.eps.toFixed(2):'--',color:'var(--text-bright)'},
  {label:'每股净资产',val:km.bps!==undefined?km.bps.toFixed(2):'--',color:'var(--text-muted)',small:true},
  {label:'ROA',val:km.roa!==undefined?km.roa.toFixed(1)+'%':'--',color:'var(--text-muted)',small:true}
]
document.getElementById('metricsGrid').innerHTML=metItems.map(m=>'<div class="metric-card"><div class="metric-label">'+m.label+'</div><div class="metric-value" style="color:'+m.color+'">'+m.val+'</div></div>').join('')
if(fin.length){const rev=new echarts.init(document.getElementById('trendChart'));
const labels=fin.map(f=>f.end_date.substring(0,7)).reverse()
const revenues=fin.map(f=>Math.round(f.revenue/100000000)).reverse()
const profits=fin.map(f=>Math.round(f.n_income/100000000)).reverse()
const roes=fin.map(f=>f.roe||0).reverse()
rev.setOption({tooltip:{trigger:'axis'},legend:{data:['营收(亿)','净利润(亿)','ROE(%)'],textStyle:{color:'#94a3b8'}},grid:{left:60,right:20,bottom:30,top:40},xAxis:{type:'category',data:labels,axisLabel:{color:'#64748b'}},yAxis:[{type:'value',name:'亿',axisLabel:{color:'#64748b'}},{type:'value',name:'%',axisLabel:{color:'#64748b'}}],series:[{name:'营收(亿)',type:'bar',data:revenues,itemStyle:{color:'#3b82f6'}},{name:'净利润(亿)',type:'bar',data:profits,itemStyle:{color:'#22c55e'}},{name:'ROE(%)',type:'line',yAxisIndex:1,data:roes,itemStyle:{color:'#f59e0b'},lineStyle:{width:2}}]})
const struc=new echarts.init(document.getElementById('structureChart'));
const sl=fin.filter(f=>f.total_assets).map(f=>f.end_date.substring(0,7)).reverse()
const assets=fin.filter(f=>f.total_assets).map(f=>Math.round(f.total_assets/100000000)).reverse()
const liabs=fin.filter(f=>f.total_assets).map(f=>Math.round(f.total_liab/100000000)).reverse()
struc.setOption({tooltip:{trigger:'axis'},legend:{data:['总资产(亿)','总负债(亿)'],textStyle:{color:'#94a3b8'}},grid:{left:60,right:20,bottom:30,top:40},xAxis:{type:'category',data:sl,axisLabel:{color:'#64748b'}},yAxis:{type:'value',name:'亿',axisLabel:{color:'#64748b'}},series:[{name:'总资产(亿)',type:'bar',data:assets,itemStyle:{color:'#3b82f6'}},{name:'总负债(亿)',type:'bar',data:liabs,itemStyle:{color:'#f59e0b'}}]})}
const divs=data.dividend_records||data.dividends||[];document.getElementById('dividendTable').innerHTML=divs.length?'<table><tr><th>报告期</th><th>现金分红(元/股)</th><th>送股(股)</th><th>转增(股)</th><th>股权登记日</th><th>除权日</th></tr>'+divs.slice(0,15).map(d=>'<tr><td>'+d.end_date.substring(0,7)+'</td><td>'+(d.cash_div||'--')+'</td><td>'+(d.stk_div||'--')+'</td><td>'+(d.stk_bo_rate||'--')+'</td><td>'+(d.record_date||'--')+'</td><td>'+(d.ex_date||'--')+'</td></tr>').join('')+'</table>':'<div style="color:var(--text-muted);padding:12px">暂无分红数据</div>'}
loadStock();</script></body></html>
