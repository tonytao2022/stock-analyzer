<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>个股深度分析</title>
<style>
:root{--bg:#0f172a;--bg-card:#1e293b;--bg-input:#1a2235;--text:#e2e8f0;--text-muted:#64748b;--text-bright:#f1f5f9;--border:#1e2d4a;--color-primary:#3b82f6;--color-safety:#22c55e;--color-warning:#f59e0b;--color-error:#ef4444;--radius:8px;--transition:.2s}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:24px}
.app-layout{max-width:1100px;margin:auto}
.top-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.search-box{display:flex;gap:8px;flex:1;min-width:300px}
.search-box input{flex:1;padding:10px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;outline:none}
.search-box input:focus{border-color:var(--color-primary)}
.search-box button{padding:10px 20px;background:var(--color-primary);border:none;border-radius:var(--radius);color:#fff;font-size:14px;cursor:pointer;font-weight:600}
.search-box button:hover{opacity:.9}
h1{font-size:18px;color:var(--text-bright)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;color:var(--text-bright);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:768px){.grid-4{grid-template-columns:repeat(2,1fr)}}
.metric-card{text-align:center;padding:16px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border)}
.metric-label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.metric-value{font-size:24px;font-weight:700;color:var(--text-bright)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{padding:10px 12px;font-size:12px;color:var(--text-muted);text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover{background:rgba(59,130,246,0.06)}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);font-size:14px}
.error{color:var(--color-error);padding:20px;text-align:center}
.stock-name{font-size:22px;font-weight:700;color:var(--text-bright);margin-bottom:4px}
.stock-code{font-size:13px;color:var(--text-muted)}
.chart-container{width:100%;height:360px}
</style></head><body>
<div class="app-layout">
<div class="top-bar">
<h1>📊 个股深度分析</h1>
<div class="search-box">
<input id="searchInput" placeholder="输入股票代码，如 000001.SZ 或 600519.SH" onkeydown="if(event.key==='Enter')loadStock()">
<button onclick="loadStock()">分析</button>
</div>
</div>
<div id="mainContent" style="display:none">
<div class="card">
<div class="stock-name" id="stockName"></div>
<div class="stock-code" id="stockCode"></div>
</div>
<div class="grid-4" id="metricsGrid"></div>
<div class="card"><div class="card-title">📈 营收/净利润趋势（近5年）</div><div id="trendTable"></div></div>
<div class="card"><div class="card-title">📊 ROE / EPS 趋势</div><div id="roeTable"></div></div>
<div class="card"><div class="card-title">🏗️ 资本结构（总资产/总负债）</div><div id="structureTable"></div></div>
<div class="card"><div class="card-title">💰 分红记录</div><div id="dividendTable"></div></div>
<div class="card"><div class="card-title">💵 现金流（近4季）</div><div id="cashflowTable"></div></div>
</div>
<div class="loading" id="loading">输入股票代码开始分析</div>
</div>
<script>
const API_BASE='/api/v1/management';

function apiGet(url){return fetch(url,{credentials:'same-origin'}).then(r=>r.json())}

function loadStock(){
  const code=document.getElementById('searchInput').value.trim();
  if(!code)return;
  document.getElementById('loading').innerHTML='⏳ 加载中...';
  document.getElementById('loading').style.display='flex';
  document.getElementById('mainContent').style.display='none';

  apiGet(API_BASE+'/stock/finance?ts_code='+code).then(fin => {
    if(fin.code!==0||!fin.data){document.getElementById('loading').innerHTML='<div class="error">加载失败: '+(fin.error||'未知错误')+'</div>';return}
    renderFinance(fin.data);
    document.getElementById('loading').style.display='none';
    document.getElementById('mainContent').style.display='block';
  }).catch(e=>{document.getElementById('loading').innerHTML='<div class="error">请求失败: '+e.message+'</div>'});
}

function fmt(str){
  if(!str)return'--';
  var s=String(str);
  if(s.length>=8) return s.substring(0,4)+'-'+s.substring(4,6)+'-'+s.substring(6,8);
  return s;
}
function fmtQ(str){
  if(!str||str.length<6)return'S'+str;
  var y=str.substring(0,4), m=str.substring(4,6);
  var qmap={'03':'Q1','06':'Q2','09':'Q3','12':'Q4'};
  return y+(qmap[m]||m);
}
function fmtNum(v,d){
  if(v===undefined||v===null||v===0)return'--';
  return Number(v).toFixed(d||2);
}
function clrNum(v,safe,mid){
  if(v==null||v===0)return'var(--text-muted)';
  if(safe!==undefined){
    if(v >= safe)return'var(--color-safety)';
    if(v >= (mid||safe/2))return'var(--color-primary)';
    return'var(--color-warning)';
  }
  return'var(--text-bright)';
}

function renderFinance(data){
  var name = data.stock_name || '';
  if(!name && data.ts_code && data.ts_code.length<=6) name = data.ts_code;

  document.getElementById('stockName').textContent = name || '--';
  document.getElementById('stockCode').textContent = data.ts_code||'';

  var km=data.latest_indicators||{};
  // 辅助从basic_info补充
  var bi=data.basic_info||{};

  var metItems=[
    {label:'ROE',val:km.roe!==undefined?km.roe.toFixed(1)+'%':'--',color:km.roe>20?'var(--color-safety)':km.roe>10?'var(--color-primary)':'var(--text-bright)'},
    {label:'毛利率',val:km.gross_profit_margin!==undefined&&km.gross_profit_margin>0?km.gross_profit_margin.toFixed(1)+'%':'--',color:'var(--text-muted)'},
    {label:'资产负债率',val:km.debt_to_assets!==undefined?km.debt_to_assets.toFixed(1)+'%':'--',color:km.debt_to_assets>70?'var(--color-error)':km.debt_to_assets>50?'var(--color-warning)':'var(--color-safety)'},
    {label:'每股收益',val:km.eps!==undefined?km.eps.toFixed(2):'--',color:'var(--text-bright)'},
    {label:'每股净资产',val:km.bps!==undefined?km.bps.toFixed(2):'--',color:'var(--text-muted)'},
    {label:'ROA',val:km.roa!==undefined?km.roa.toFixed(1)+'%':'--',color:'var(--text-muted)'},
    {label:'市盈率PE',val:bi.pe&&bi.pe>0?bi.pe.toFixed(1):'--',color:'var(--text-muted)'},
    {label:'市净率PB',val:bi.pb&&bi.pb>0?bi.pb.toFixed(1):'--',color:'var(--text-muted)'}
  ];
  document.getElementById('metricsGrid').innerHTML=metItems.map(function(m){
    return'<div class="metric-card"><div class="metric-label">'+m.label+'</div><div class="metric-value" style="color:'+m.color+'">'+m.val+'</div></div>';
  }).join('');

  // ── 1. 营收/净利润趋势表 ──
  var trend=data.annual_trend||[];
  if(trend.length>0){
    var html='<table><tr><th>报告期</th><th>营收(亿)</th><th>净利润(亿)</th><th>营业利润(亿)</th><th>净利率</th></tr>';
    for(var i=0;i<trend.length;i++){
      var t=trend[i];
      var npr=t.revenue>0?(t.n_income/t.revenue*100):0;
      html+='<tr><td>'+fmtQ(t.end_date)+'</td><td class="num">'+fmtNum(t.revenue)+'</td><td class="num" style="color:var(--color-safety)">'+fmtNum(t.n_income)+'</td><td class="num">'+fmtNum(t.operate_profit)+'</td><td class="num">'+(npr>0?npr.toFixed(1)+'%':'--')+'</td></tr>';
    }
    html+='</table>';
    document.getElementById('trendTable').innerHTML=html;
  } else {
    document.getElementById('trendTable').innerHTML='<div style="color:var(--text-muted);padding:12px">暂无营收趋势数据</div>';
  }

  // ── 2. ROE/EPS趋势表 ──
  var roe=data.roe_trend||[];
  if(roe.length>0){
    var html2='<table><tr><th>报告期</th><th>ROE(%)</th><th>EPS(元)</th></tr>';
    for(var i2=0;i2<roe.length;i2++){
      var r=roe[i2];
      html2+='<tr><td>'+fmtQ(r.end_date)+'</td><td class="num" style="color:'+clrNum(r.roe,20,10)+'">'+fmtNum(r.roe,1)+'</td><td class="num">'+fmtNum(r.eps,2)+'</td></tr>';
    }
    html2+='</table>';
    document.getElementById('roeTable').innerHTML=html2;
  } else {
    document.getElementById('roeTable').innerHTML='<div style="color:var(--text-muted);padding:12px">暂无ROE趋势数据</div>';
  }

  // ── 3. 资本结构表 ──
  var struc=data.capital_structure||[];
  if(struc.length>0){
    var html3='<table><tr><th>报告期</th><th>总资产(亿)</th><th>总负债(亿)</th><th>资产负债率</th><th>归属母公司股东权益(亿)</th></tr>';
    for(var i3=0;i3<struc.length;i3++){
      var s=struc[i3];
      var dar=s.total_assets>0?(s.total_liab/s.total_assets*100):0;
      html3+='<tr><td>'+fmtQ(s.end_date)+'</td><td class="num">'+fmtNum(s.total_assets)+'</td><td class="num">'+fmtNum(s.total_liab)+'</td><td class="num" style="color:'+(dar>70?'var(--color-error)':dar>50?'var(--color-warning)':'var(--color-safety)')+'">'+(dar>0?dar.toFixed(1)+'%':'--')+'</td><td class="num">'+fmtNum(s.total_hldr_eqy_excl_min_int)+'</td></tr>';
    }
    html3+='</table>';
    document.getElementById('structureTable').innerHTML=html3;
  } else {
    document.getElementById('structureTable').innerHTML='<div style="color:var(--text-muted);padding:12px">暂无资本结构数据</div>';
  }

  // ── 4. 分红记录表 ──
  var divs=data.dividend_records||[];
  if(divs.length>0){
    var html4='<table><tr><th>除权日</th><th>发放日</th><th>每股分红(元)</th><th>分红类型</th><th>基准股本(亿)</th></tr>';
    for(var i4=0;i4<divs.length;i4++){
      var d=divs[i4];
      html4+='<tr><td>'+d.ex_date+'</td><td>'+d.pay_date+'</td><td class="num">'+fmtNum(d.dividend_per_share,3)+'</td><td>'+d.dividend_type+'</td><td class="num">'+fmtNum(d.base_share)+'</td></tr>';
    }
    html4+='</table>';
    document.getElementById('dividendTable').innerHTML=html4;
  } else {
    document.getElementById('dividendTable').innerHTML='<div style="color:var(--text-muted);padding:12px">暂无分红数据（Tushare接口未返回记录）</div>';
  }

  // ── 5. 现金流表 ──
  var cf=data.cashflow||[];
  if(cf.length>0){
    var html5='<table><tr><th>报告期</th><th>经营活动现金流(亿)</th><th>投资活动现金流(亿)</th><th>筹资活动现金流(亿)</th><th>自由现金流(亿)</th></tr>';
    for(var i5=0;i5<cf.length;i5++){
      var c=cf[i5];
      html5+='<tr><td>'+fmtQ(c.end_date)+'</td><td class="num" style="color:'+(c.n_cashflow_act>0?'var(--color-safety)':'var(--color-error)')+'">'+fmtNum(c.n_cashflow_act)+'</td><td class="num">'+fmtNum(c.n_cashflow_inv)+'</td><td class="num">'+fmtNum(c.n_cashflow_fin)+'</td><td class="num" style="color:'+(c.free_cashflow>0?'var(--color-safety)':'var(--color-error)')+'">'+fmtNum(c.free_cashflow)+'</td></tr>';
    }
    html5+='</table>';
    document.getElementById('cashflowTable').innerHTML=html5;
  } else {
    document.getElementById('cashflowTable').innerHTML='<div style="color:var(--text-muted);padding:12px">暂无现金流数据</div>';
  }
}

// 页面加载时如果URL带了参数则自动分析
(function(){
  var params=new URLSearchParams(window.location.search);
  var code=params.get('ts_code')||params.get('code');
  if(code){
    document.getElementById('searchInput').value=code;
    loadStock();
  }
})();
</script></body></html>
